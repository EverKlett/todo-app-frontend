<div
  class="todo"
  [ngClass]="{ isDone: todo.isDone, isNotDone: !todo.isDone }"
  (dblclick)="onToggle(todo)"
>
  <h3>
    {{ todo.task }}
    <fa-icon
      [icon]="faTimes"
      [ngStyle]="{ color: 'red' }"
      (click)="onDelete(todo)">
    </fa-icon>
  </h3>
  <p *ngIf=" updatedAt ">{{ updatedAt.toLocaleString('pt-BR', { timeZone: 'UTC' }) }}</p>
</div>
