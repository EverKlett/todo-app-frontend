<div
  class="todo todo-outer-div"
  [ngClass]="{ isDone: todo.isDone, isNotDone: !todo.isDone }"

  (dblclick)="onToggle()"
>
  <div class="todo-inner-div">
    <h3
      appRaibowText={{todo.task}}
    >
    </h3>
    <p
      appRaibowText="{{ updatedAt | date:'medium' }}"
    ></p>

  </div>
  <fa-icon class="icon faTimes" [icon]="faTimes" size="2x"
    (click)="onDelete()">
  </fa-icon>
</div>
