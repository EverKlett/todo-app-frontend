<app-button
    [color]="(state === 'visible') ? ('red') : ('green')"
    [text]="(state === 'visible') ? ('Discard') : ('Add')"
    (btnClick)="onToggleButton()"
  ></app-button>
<div
  class="slide"
  [@state]="state"
  (@state.done)="changeState($event)"
>
  <app-add-todo *ngIf="isActive" (onAddTodo)="onAddTodo($event)"></app-add-todo>
</div>
